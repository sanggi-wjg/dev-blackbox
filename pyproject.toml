[project]
name = "dev-blackbox"
version = "0.1.0"
description = ""
authors = [
    { name = "Raynor", email = "jonggu.woo@fitpet.co.kr" }
]
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "llama-index-core (>=0.14.21,<0.15.0)",
    "llama-index-llms-ollama (>=0.10.1,<0.11.0)",
    "llama-index-embeddings-ollama (>=0.9.0,<0.10.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "cryptography (>=48.0.0,<49.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "jira (>=3.10.5,<4.0.0)",
    "slack-sdk (>=3.41.0,<4.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "python-multipart (>=0.0.28,<0.0.29)",
    "pre-commit (>=4.6.0,<5.0.0)",
]

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "pyright (>=1.1.409,<2.0.0)",
    "testcontainers[postgres] (>=4.14.2,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-env (>=1.6.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "fakeredis (>=2.35.1,<3.0.0)",
    "pytest-httpx (>=0.36.2,<0.37.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py314']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
python_classes = ['*Test']
addopts = "--cov=dev_blackbox --cov-report=html --cov-report=xml"
# https://pytest-cov.readthedocs.io/en/latest/readme.html

[tool.pytest_env]
ENV = "test"
DATABASE__DEBUG = "True"
DATABASE__HOST = "localhost"
DATABASE__PORT = "7400"
DATABASE__DATABASE = "dev_blackbox"
DATABASE__USER = "blackbox"
DATABASE__PASSWORD = "passw0rd"
REDIS__HOST = "localhost"
REDIS__PORT = "7410"
ENCRYPTION__KEY = "test-encryption-key-base64-abcdefghijklmnopqrstuvwxyz"
ENCRYPTION__PEPPER = "test-pepper-secret"
AUTH__SECRET_KEY = "test-jwt-secret-key-abcdefghijklmnopqrstuvwxyz"
AUTH__ALGORITHM = "HS256"
AUTH__ACCESS_TOKEN_EXPIRE_MINUTES = "30"
SLACK__BOT_TOKEN = "xoxb-test-token"

[tool.coverage.run]
source = ["dev_blackbox"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "security_config.py",
    "exception_handler.py",
    "logging.py",
    "background_scheduler.py",
    "config.py",
    "database.py",
    "exceptions.py",
    "middleware.py",
    "types.py",
    "*/dto/*",
    "*/entity/*",
    "*/task/*",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]
precision = 1
show_missing = true
skip_covered = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
